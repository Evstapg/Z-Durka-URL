<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Z-Durka Loading Screen</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #050505;
            color: #ffffff;
        }
 
        .bg-slider {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .bg-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        .bg-slide.active {
            opacity: 1;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.6) 100%);
            z-index: 2;
        }

        .sidebar {
            position: absolute;
            top: 0;
            left: 0;
            width: 35%; 
            min-width: 450px;
            height: 100%;
            background-color: #000000;
            z-index: 3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 0 50px;
            box-shadow: 15px 0 50px rgba(0,0,0,0.9);
            overflow: hidden;
        }

    
        .grid-bg {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(rgba(160, 0, 0, 0.3) 2px, transparent 2px),
                linear-gradient(90deg, rgba(160, 0, 0, 0.3) 2px, transparent 2px);
            background-size: 40px 40px;
            z-index: -2;
            animation: gridFlow 4s linear infinite;
        }

        .grid-vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 40% 50%, transparent 10%, #000000 85%);
            z-index: -1;
        }

        @keyframes gridFlow {
            0% { transform: translate(0, 0); }
            100% { transform: translate(40px, 40px); }
        }


    
        .server-title {
            font-family: 'Chakra Petch', sans-serif;
            text-transform: uppercase;
            font-size: 5rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            text-align: left;
            position: relative;
            z-index: 4;
        }

        .red-z {
            color: #ff0000;
            text-shadow: 0 0 25px rgba(255, 0, 0, 0.8);
        }

        .white-durka {
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }


        .tips-container {
            position: relative;
            z-index: 4;
            min-height: 60px;
            margin-bottom: 30px;
            color: #b0b0b0;
            font-size: 1.1rem;
            font-style: italic;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
            opacity: 1;
            transition: opacity 0.5s ease;
            max-width: 90%;
        }

        .tips-title {
            color: #ff2a2a;
            font-weight: bold;
            font-style: normal;
            margin-bottom: 5px;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .loading-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            z-index: 4;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.05rem;
            color: #e0e0e0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            font-weight: 500;
        }

        .status-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 85%;
            text-align: left;
        }

        .progress-percentage {
            color: #ff2a2a;
            font-weight: 700;
        }

        .progress-line-container {
            width: 100%;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #b30000, #ff2a2a);
            border-radius: 3px;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 42, 42, 0.9);
        }

        .credits {
            position: absolute;
            bottom: 30px;
            left: 50px;
            color: #7a7a7a;
            font-size: 0.95rem;
            font-weight: 500;
            z-index: 4;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="bg-slider">
        <div id="slide1" class="bg-slide active" style="background-image: url('picture/main1.png');"></div>
        <div id="slide2" class="bg-slide"></div>
    </div>
    <div class="overlay"></div>

    <audio id="bg-music" loop preload="auto"></audio>

    <div class="sidebar">
        <div class="grid-bg"></div>
        <div class="grid-vignette"></div>

        <h1 class="server-title"><span class="red-z">Z</span><span class="white-durka">-Durka</span></h1>

        <div class="tips-container" id="tips-container">
            <div class="tips-title">Интересный факт:</div>
            <div id="tip-text">Добро пожаловать на сервер. Подключение...</div>
        </div>

        <div class="loading-wrapper">
            <div class="status-row">
                <div id="status" class="status-text">Подключение к серверу...</div>
                <div id="percentage" class="progress-percentage">0%</div>
            </div>
            <div class="progress-line-container">
                <div id="progress" class="progress-bar"></div>
            </div>
        </div>
        
        <div class="credits">By: Evstapg & Konami</div>
    </div>

    <script>
        const audio = document.getElementById('bg-music');
        let audioStarted = false;

        const randomTrackNum = Math.floor(Math.random() * 4) + 1;
        audio.src = `music/mus${randomTrackNum}.MP3`; 

        function playMusic() {
            if (!audio) return;
            audio.volume = 0.3;
            audio.loop = true;

            let playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    audioStarted = true;
                }).catch(err => {
                    console.log("Ожидание события для запуска аудио...");
                });
            }
        }

        window.addEventListener('load', playMusic);
        document.addEventListener('click', playMusic);
        document.addEventListener('mousemove', playMusic);
        document.addEventListener('keydown', playMusic);

    
        const zCityTips = [
            "Z-Durka появилась ещё в октябре 2025 года как локалка",
            "В режиме ДБД убийца бессмертен, не пытайтесь его убить",
            "Мы проводим крутые ивенты почти каждый день",
            "Качез не раздает патроны (наверное)",
            "В нашем дискорд сервере возможно есть фури фембойчики",
            "Никому не доверяй"
        ];
        
        let currentTipIndex = 0;
        const tipContainer = document.getElementById('tips-container');
        const tipTextElement = document.getElementById('tip-text');

        tipTextElement.innerText = zCityTips[0];
        setInterval(() => {
            tipContainer.style.opacity = 0;
            
     
            setTimeout(() => {
                currentTipIndex = (currentTipIndex + 1) % zCityTips.length;
                tipTextElement.innerText = zCityTips[currentTipIndex];
                tipContainer.style.opacity = 1;
            }, 500); 
        }, 5000);


        const images = [
            'picture/main1.png',
            'picture/main2.png',
            'picture/main3.png',
            'picture/main4.png',
            'picture/main5.png',
            'picture/main6.png',
            'picture/main7.png',
            'picture/main8.png',
            'picture/main9.png',
            'picture/main10.png'
        ];

        let currentIndex = 0;
        let activeSlideNum = 1;

        setInterval(() => {
            currentIndex = (currentIndex + 1) % images.length;
            
            const currentSlide = document.getElementById(`slide${activeSlideNum}`);
            activeSlideNum = activeSlideNum === 1 ? 2 : 1;
            const nextSlide = document.getElementById(`slide${activeSlideNum}`);

            nextSlide.style.backgroundImage = `url('${images[currentIndex]}')`;
            nextSlide.classList.add('active');
            currentSlide.classList.remove('active');
        }, 10000);

    
        let totalFiles = 1;
        let neededFiles = 1;

        function updateProgress() {
            if (totalFiles <= 0) return;
            let downloaded = totalFiles - neededFiles;
            let percent = Math.min(Math.max(Math.floor((downloaded / totalFiles) * 100), 0), 100);
            
            document.getElementById('progress').style.width = percent + '%';
            document.getElementById('percentage').innerText = percent + '%';
        }

        function DownloadingFile(fileName) {
            document.getElementById('status').innerText = 'Загрузка: ' + fileName;
            updateProgress();
            if (!audioStarted) playMusic(); 
        }

        function SetStatusChanged(status) {
            document.getElementById('status').innerText = status;
            if (!audioStarted) playMusic(); 
        }

        function SetFilesTotal(total) {
            totalFiles = Math.max(total, 1);
            updateProgress();
            if (!audioStarted) playMusic();
        }

        function SetFilesNeeded(needed) {
            neededFiles = needed;
            updateProgress();
            if (!audioStarted) playMusic();
        }
    </script>
</body>
</html>
